# HireFast local development stack
services:
  postgres:
    image: postgres:16-alpine
    container_name: hirefast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hirefast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirefast}
      POSTGRES_DB: ${POSTGRES_DB:-hirefast}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hirefast} -d ${POSTGRES_DB:-hirefast}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hirefast-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: hirefast-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hirefast}:${POSTGRES_PASSWORD:-hirefast}@postgres:5432/${POSTGRES_DB:-hirefast}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 4000
    ports:
      - '${PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  candidate-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.candidate
    container_name: hirefast-candidate-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - backend

  admin-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: hirefast-admin-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_ADMIN_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
    ports:
      - '3001:3001'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
