          $ref: '#/components/responses/Forbidden'

  /admin/settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [AdminSettings]
      summary: Upsert platform setting
      operationId: adminUpsertSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {}
                description:
                  type: string
                isPublic:
                  type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessSetting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/audit-logs:
    get:
      tags: [AdminAudit]
      summary: Audit log trail
      operationId: adminListAuditLogs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: action
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: resourceType
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/hr-reviews:
    get:
      tags: [HrReviews]
      summary: HR review queue
      operationId: adminListHrReviews
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/HrReviewStatus'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessHrReviewPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [HrReviews]
      summary: Create HR review
      operationId: adminCreateHrReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId]
              properties:
                attemptId:
                  $ref: '#/components/schemas/UUID'
                notes:
                  type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessHrReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/hr-reviews/{reviewId}:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    get:
      tags: [HrReviews]
      summary: HR review detail
      operationId: adminGetHrReview
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessHrReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [HrReviews]
      summary: Update HR review decision
      operationId: adminPatchHrReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/HrReviewStatus'
                notes:
                  type: string
                reviewerId:
                  $ref: '#/components/schemas/UUID'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessHrReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
    QueryQ:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'

  responses:
    OkEmptyData:
      description: Success with empty object data
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccessBase'
              - type: object
                properties:
                  data:
                    type: object
                    additionalProperties: false
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    UUID:
      type: string
      format: uuid
    ApiSuccessBase:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data: {}
    ApiErrorDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    ApiError:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
    PaginatedMeta:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
        featureEnabled:
          type: boolean
          description: Optional feature flag for future endpoints

    UserRole:
      type: string
      description: Identity role only — not a commercial tier
      enum: [ADMIN, USER, GUEST]
    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED, PENDING_REGISTRATION]
    AssessmentStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    AssessmentAccessTier:
      type: string
      enum: [FREE, PREMIUM]
    AttemptStatus:
      type: string
      enum: [IN_PROGRESS, SUBMITTED, EVALUATING, COMPLETED, FAILED, ABANDONED]
    EvaluationStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]
    ReportStatus:
      type: string
      enum: [PENDING, GENERATING, READY, FAILED]
    NotificationType:
      type: string
      enum: [SYSTEM, ASSESSMENT, GAMIFICATION, SUBSCRIPTION, HR_REVIEW, LEARNING]
    FilePurpose:
      type: string
      enum: [AVATAR, ASSESSMENT_MEDIA, RESPONSE_ATTACHMENT, REPORT_ASSET, OTHER]
    HrReviewStatus:
      type: string
      enum: [PENDING, IN_REVIEW, APPROVED, REJECTED, NEEDS_CHANGES]
    QuestionType:
      type: string
      enum:
        - MULTIPLE_CHOICE
        - MULTI_SELECT
        - TRUE_FALSE
        - SHORT_TEXT
        - LONG_TEXT
        - AUDIO
        - VIDEO
        - FILE_UPLOAD
        - RATING

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: string
          example: 15m
        tokenType:
          type: string
          example: Bearer
    CurrentUser:
      type: object
      required: [id, email, role, status, emailVerified, profile]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
        profile:
          type: object
          properties:
            isComplete:
              type: boolean
            displayName:
              type: string
              nullable: true
            avatarUrl:
              type: string
              nullable: true
        subscription:
          type: object
          nullable: true
          properties:
            planCode:
              type: string
            status:
              type: string
    Profile:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UUID'
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        headline:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        isComplete:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true
    ProfileWrite:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        displayName:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        headline:
          type: string
          maxLength: 255
        bio:
          type: string
        locale:
          type: string
        timezone:
          type: string
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
    Preferences:
      type: object
      properties:
        inAppEnabled:
          type: boolean
        emailEnabled:
          type: boolean
        assessmentAlerts:
          type: boolean
        gamificationAlerts:
          type: boolean
        marketingEmails:
          type: boolean
    PreferencesWrite:
      type: object
      properties:
        inAppEnabled:
          type: boolean
        emailEnabled:
          type: boolean
        assessmentAlerts:
          type: boolean
        gamificationAlerts:
          type: boolean
        marketingEmails:
          type: boolean
    FileMeta:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        purpose:
          $ref: '#/components/schemas/FilePurpose'
        url:
          type: string
          nullable: true
    FileUploadInit:
      type: object
      required: [purpose, fileName, mimeType, sizeBytes]
      properties:
        mode:
          type: string
          enum: [presign, multipart]
          default: presign
        purpose:
          $ref: '#/components/schemas/FilePurpose'
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
    Assessment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        code:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        instructions:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        accessTier:
          $ref: '#/components/schemas/AssessmentAccessTier'
        durationMinutes:
          type: integer
          nullable: true
        categoryId:
          $ref: '#/components/schemas/UUID'
        categoryName:
          type: string
    AssessmentWrite:
      type: object
      required: [categoryId, code, slug, title, accessTier]
      properties:
        categoryId:
          $ref: '#/components/schemas/UUID'
        code:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        instructions:
          type: string
        accessTier:
          $ref: '#/components/schemas/AssessmentAccessTier'
        durationMinutes:
          type: integer
        passingScore:
          type: number
        maxAttempts:
          type: integer
        skillIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
    Attempt:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        assessmentId:
          $ref: '#/components/schemas/UUID'
        attemptNumber:
          type: integer
        status:
          $ref: '#/components/schemas/AttemptStatus'
        startedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
        resultsLocked:
          type: boolean
        assessmentTitle:
          type: string
    ResponseWrite:
      type: object
      properties:
        selectedOptionId:
          $ref: '#/components/schemas/UUID'
        textAnswer:
          type: string
        numericAnswer:
          type: number
        fileId:
          $ref: '#/components/schemas/UUID'
        rawPayload:
          type: object
          additionalProperties: true
    ResponsesBatchWrite:
      type: object
      required: [responses]
      properties:
        responses:
          type: array
          items:
            allOf:
              - type: object
                required: [questionId]
                properties:
                  questionId:
                    $ref: '#/components/schemas/UUID'
              - $ref: '#/components/schemas/ResponseWrite'
    PlayerQuestion:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        prompt:
          type: string
        questionType:
          $ref: '#/components/schemas/QuestionType'
        sortOrder:
          type: integer
        points:
          type: number
        isRequired:
          type: boolean
        options:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/UUID'
              label:
                type: string
              value:
                type: string
              sortOrder:
                type: integer
    Evaluation:
      type: object
      properties:
        attemptId:
          $ref: '#/components/schemas/UUID'
        status:
          $ref: '#/components/schemas/EvaluationStatus'
        totalScore:
          type: number
          nullable: true
        maxScore:
          type: number
          nullable: true
        percentage:
          type: number
          nullable: true
        passed:
          type: boolean
          nullable: true
        evaluatedAt:
          type: string
          format: date-time
          nullable: true
    Jrs:
      type: object
      properties:
        overallScore:
          type: number
        band:
          type: string
          nullable: true
        version:
          type: string
        calculatedAt:
          type: string
          format: date-time
        skillScores:
          type: array
          items:
            type: object
            properties:
              skillId:
                $ref: '#/components/schemas/UUID'
              skillCode:
                type: string
              skillName:
                type: string
              score:
                type: number
              weight:
                type: number
    AiEvaluation:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EvaluationStatus'
        provider:
          type: string
        summary:
          type: string
          nullable: true
        strengths:
          type: string
          nullable: true
        weaknesses:
          type: string
          nullable: true
        processedAt:
          type: string
          format: date-time
          nullable: true
    Report:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        status:
          $ref: '#/components/schemas/ReportStatus'
        summary:
          type: string
          nullable: true
        generatedAt:
          type: string
          format: date-time
          nullable: true
        sections:
          type: array
          items:
            type: object
            properties:
              sectionKey:
                type: string
              title:
                type: string
              content:
                type: string
              sortOrder:
                type: integer
    Dashboard:
      type: object
      properties:
        profile:
          type: object
          properties:
            isComplete:
              type: boolean
            displayName:
              type: string
              nullable: true
        jrs:
          type: object
          nullable: true
          properties:
            overallScore:
              type: number
            band:
              type: string
            calculatedAt:
              type: string
              format: date-time
        assessments:
          type: object
          properties:
            completed:
              type: integer
            inProgress:
              type: integer
            available:
              type: integer
        latestAttempt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Attempt'
        gamification:
          type: object
          properties:
            totalXp:
              type: integer
            level:
              type: object
              properties:
                levelNumber:
                  type: integer
                name:
                  type: string
            currentStreak:
              type: integer
            badgesEarned:
              type: integer
        subscription:
          type: object
          properties:
            planCode:
              type: string
            status:
              type: string
        resultsLocked:
          type: boolean
    QuestionWrite:
      type: object
      required: [code, prompt, questionType]
      properties:
        code:
          type: string
        prompt:
          type: string
        questionType:
          $ref: '#/components/schemas/QuestionType'
        sortOrder:
          type: integer
        points:
          type: number
        isRequired:
          type: boolean
        timeLimitSec:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOptionWrite'
    QuestionOptionWrite:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        sortOrder:
          type: integer
        isCorrect:
          type: boolean
        points:
          type: number
    Question:
      allOf:
        - $ref: '#/components/schemas/QuestionWrite'
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            assessmentId:
              $ref: '#/components/schemas/UUID'
    QuestionOption:
      allOf:
        - $ref: '#/components/schemas/QuestionOptionWrite'
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            questionId:
              $ref: '#/components/schemas/UUID'
    AnalyticsEventWrite:
      type: object
      required: [eventName]
      properties:
        eventName:
          type: string
        userId:
          $ref: '#/components/schemas/UUID'
        properties:
          type: object
          additionalProperties: true
        sessionId:
          type: string

    # Envelope helpers
    ApiSuccessHealth:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, degraded, error]
                timestamp:
                  type: string
                  format: date-time
                environment:
                  type: string
                services:
                  type: object
                  properties:
                    api:
                      type: string
                    database:
                      type: string
                    redis:
                      type: string
                version:
                  type: string
    ApiSuccessGoogleStart:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                authorizationUrl:
                  type: string
                  format: uri
                state:
                  type: string
    ApiSuccessAuthTokens:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthTokens'
    ApiSuccessCurrentUser:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CurrentUser'
    ApiSuccessSession:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                valid:
                  type: boolean
                expiresAt:
                  type: string
                  format: date-time
                role:
                  $ref: '#/components/schemas/UserRole'
    ApiSuccessRbac:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                role:
                  $ref: '#/components/schemas/UserRole'
                permissions:
                  type: array
                  items:
                    type: string
    ApiSuccessProfile:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Profile'
    ApiSuccessPreferences:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Preferences'
    ApiSuccessFileMeta:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FileMeta'
    ApiSuccessFileUpload:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                fileId:
                  $ref: '#/components/schemas/UUID'
                objectKey:
                  type: string
                upload:
                  type: object
                  properties:
                    url:
                      type: string
                    fields:
                      type: object
                      additionalProperties:
                        type: string
    ApiSuccessCategoryList:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/UUID'
                  code:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
