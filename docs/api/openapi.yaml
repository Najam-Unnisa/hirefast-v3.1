openapi: 3.0.3
info:
  title: HireFast API
  version: 1.0.0
  description: |
    HireFast AI-powered employability assessment platform API contract (v1).

    This file is the **authoritative design-time / architecture OpenAPI contract**.
    It describes the **target** API surface for HireFast. It is **not** served by
    the running API's Swagger UI (`/docs`), which documents implemented Express
    routes only.

    Implementation is incremental per the HireFast development roadmap.
    See `docs/api/CONTRACT_VS_RUNTIME.md`.

    Base path: `/api/v1`.

    Related docs: `docs/api/ARCHITECTURE.md`, `ENDPOINT_CATALOG.md`, `STANDARDS.md`,
    `AUTH_MATRIX.md`, `CONTRACT_VS_RUNTIME.md`.
  contact:
    name: HireFast Engineering
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: https://api.hirefast.example/api/v1
    description: Production (example)
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Profiles
  - name: Files
  - name: AssessmentCategories
  - name: Assessments
  - name: Attempts
  - name: Evaluation
  - name: Reports
  - name: Dashboard
  - name: Gamification
  - name: Notifications
  - name: Subscriptions
  - name: Premium
  - name: Settings
  - name: AdminUsers
  - name: AdminAssessments
  - name: AdminAnalytics
  - name: AdminSettings
  - name: AdminAudit
  - name: HrReviews
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Versioned health check
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Health payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessHealth'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/google:
    post:
      tags: [Auth]
      summary: Start Google OAuth
      security: []
      operationId: startGoogleAuth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                redirectUri:
                  type: string
                  format: uri
      responses:
        '200':
          description: Authorization URL issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGoogleStart'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      security: []
      operationId: googleAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tokens issued (JSON clients)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAuthTokens'
        '302':
          description: Redirect to app with tokens/code (browser flow)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate refresh session
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/OkEmptyData'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      operationId: getAuthMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessCurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/session:
    get:
      tags: [Auth]
      summary: Validate access session
      operationId: getAuthSession
      responses:
        '200':
          description: Session validity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/rbac:
    get:
      tags: [Auth]
      summary: Effective permissions for current user
      operationId: getAuthRbac
      responses:
        '200':
          description: Role and permission codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessRbac'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [Users]
      summary: Current user resource
      operationId: getUsersMe
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessCurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/profile:
    get:
      tags: [Profiles]
      summary: Get profile
      operationId: getMyProfile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profiles]
      summary: Replace profile
      operationId: putMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Profiles]
      summary: Patch profile
      operationId: patchMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/me/profile/complete:
    post:
      tags: [Profiles]
      summary: Complete profile registration
      operationId: completeMyProfile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileWrite'
      responses:
        '200':
          description: Profile marked complete; identity role becomes USER (commercial plan via subscription)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/me/preferences:
    get:
      tags: [Profiles]
      summary: Get user preferences
      operationId: getMyPreferences
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profiles]
      summary: Update preferences
      operationId: patchMyPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/me/avatar:
    get:
      tags: [Profiles]
      summary: Avatar file metadata
      operationId: getMyAvatar
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessFileMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Profiles]
      summary: Attach avatar by fileId
      operationId: putMyAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId:
                  $ref: '#/components/schemas/UUID'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessFileMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/me/resume:
    get:
      tags: [Profiles]
      summary: Resume file metadata
      operationId: getMyResume
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessFileMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Profiles]
      summary: Attach resume by fileId
      operationId: putMyResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId:
                  $ref: '#/components/schemas/UUID'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessFileMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /files/uploads:
    post:
      tags: [Files]
      summary: Initiate file upload
      operationId: initiateFileUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadInit'
          multipart/form-data:
            schema:
              type: object
              required: [purpose, file]
              properties:
                purpose:
                  $ref: '#/components/schemas/FilePurpose'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Upload initiated or stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessFileUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [Files]
      summary: Get file metadata
      operationId: getFile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessFileMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Files]
      summary: Soft-delete file metadata
      operationId: deleteFile
      responses:
        '200':
          $ref: '#/components/responses/OkEmptyData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assessment-categories:
    get:
      tags: [AssessmentCategories]
      summary: List assessment categories
      operationId: listAssessmentCategories
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessCategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /assessments:
    get:
      tags: [Assessments]
      summary: Assessment catalog
      operationId: listAssessments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/QueryQ'
        - name: categoryId
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: accessTier
          in: query
          schema:
            $ref: '#/components/schemas/AssessmentAccessTier'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssessmentStatus'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAssessmentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /assessments/{assessmentId}:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [Assessments]
      summary: Assessment detail
      operationId: getAssessment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAssessment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assessments/slug/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Assessments]
      summary: Assessment detail by slug
      operationId: getAssessmentBySlug
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAssessment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assessments/{assessmentId}/attempts:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    post:
      tags: [Attempts]
      summary: Start or resume assessment attempt
      operationId: startAttempt
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resumeIfInProgress:
                  type: boolean
                  default: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'

  /attempts/me:
    get:
      tags: [Attempts]
      summary: My assessment history
      operationId: listMyAttempts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AttemptStatus'
        - name: assessmentId
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAttemptPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Attempts]
      summary: Attempt summary
      operationId: getAttempt
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attempts/{attemptId}/status:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Attempts]
      summary: Attempt status poll
      operationId: getAttemptStatus
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAttemptStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attempts/{attemptId}/questions:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Attempts]
      summary: Questions for attempt player (no correct flags)
      operationId: getAttemptQuestions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPlayerQuestions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attempts/{attemptId}/responses:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    patch:
      tags: [Attempts]
      summary: Autosave responses
      operationId: autosaveResponses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesBatchWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAutosave'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /attempts/{attemptId}/responses/{questionId}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
      - $ref: '#/components/parameters/QuestionId'
    put:
      tags: [Attempts]
      summary: Upsert single response
      operationId: upsertResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAutosave'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /attempts/{attemptId}/submit:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [Attempts]
      summary: Submit attempt
      operationId: submitAttempt
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /attempts/{attemptId}/evaluation:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [Evaluation]
      summary: Trigger backend evaluation
      operationId: triggerEvaluation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEvaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Evaluation]
      summary: Get deterministic evaluation
      operationId: getEvaluation
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEvaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attempts/{attemptId}/evaluation/skills:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Evaluation]
      summary: Evaluation skill scores
      operationId: getEvaluationSkills
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessSkillScoreList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /attempts/{attemptId}/jrs:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Evaluation]
      summary: Job Readiness Score for attempt
      operationId: getAttemptJrs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessJrs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/jrs/latest:
    get:
      tags: [Evaluation]
      summary: Latest Job Readiness Score
      operationId: getLatestJrs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessJrs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attempts/{attemptId}/ai-evaluation:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Evaluation]
      summary: AI qualitative evaluation
      operationId: getAiEvaluation
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessAiEvaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /attempts/{attemptId}/reports:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Reports]
      summary: List reports for attempt
      operationId: listAttemptReports
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessReportList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Reports]
      summary: Request AI report generation
      operationId: createAttemptReport
      responses:
        '202':
          description: Accepted for async generation (envelope still used with 200 or 202)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessReport'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Reports]
      summary: Report detail with sections
      operationId: getReport
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
